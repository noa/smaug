# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements        # flags leftover breakpoint() / pdb
      - id: check-ast               # validates Python syntax

  # ── Secrets / credential detection ────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # ── Ruff – linting & formatting ───────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff                     # linter
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format              # formatter (replaces black)

  # ── Type checking ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        verbose: true                # show output even on success
        args: [--config-file=pyproject.toml, --warn-unused-ignores]
        additional_dependencies:
          - types-PyYAML
          - types-openpyxl
          - pandas-stubs
          - pytest
          - ruamel.yaml
